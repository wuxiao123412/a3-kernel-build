name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            python3 git curl zip unzip rsync

      - name: Clone crDroid kernel (16.0)
        run: |
          git clone --depth 1 -b 16.0 \
            https://github.com/crdroidandroid/android_kernel_oneplus_sm8550 kernel
          cd kernel
          git log --oneline -1

      - name: Locate clang prebuilt
        run: |
          set -e
          REPO=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git clone --depth 1 --filter=blob:none --sparse "$REPO" /tmp/clangrepo
          cd /tmp/clangrepo
          echo "=== clang dirs in main HEAD ==="
          git ls-tree --name-only HEAD | grep '^clang-' | sort -V | tail -40 || true
          echo "=== branches ==="
          git ls-remote --heads origin 2>/dev/null | grep -E 'refs/heads/(main|android1[4-7]-release|android1[5-7])$' || true
          TARGET=""
          for BR in main android17-release android16-release android15-release; do
            echo "--- trying branch: $BR"
            if ! git fetch --depth 1 origin "$BR" 2>/dev/null; then echo "  fetch failed"; continue; fi
            git checkout -q FETCH_HEAD
            echo "  clang dirs:"; git ls-tree --name-only HEAD | grep '^clang-' | sort -V | tail -10 || true
            if git ls-tree --name-only HEAD | grep -qx 'clang-r563880c'; then TARGET=clang-r563880c; echo "FOUND clang-r563880c in $BR"; break; fi
          done
          if [ -z "$TARGET" ]; then
            echo "!!! 没找到 clang-r563880c，回退到该分支最新 clang-r* 目录"
            TARGET=$(git ls-tree --name-only HEAD | grep '^clang-r' | sort -V | tail -1)
            echo "FALLBACK: $TARGET"
          fi
          echo "SELECTED=$TARGET"
          git sparse-checkout set "$TARGET"
          echo "/tmp/clangrepo/$TARGET/bin" >> $GITHUB_PATH
          /tmp/clangrepo/$TARGET/bin/clang --version

      - name: Integrate KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh
          echo "--- drivers/kernelsu ---"
          ls -la drivers/kernelsu
          echo "--- drivers/Makefile ---"
          tail -3 drivers/Makefile
          echo "--- drivers/Kconfig ---"
          grep -n kernelsu drivers/Kconfig

      - name: Configure
        run: |
          cd kernel
          cp "$GITHUB_WORKSPACE/config" .config
          ./scripts/config --file .config -e KSU
          ./scripts/config --file .config -e MODULES -e MODVERSIONS -e KPROBES -e KALLSYMS_ALL
          ./scripts/config --file .config -e LTO_CLANG -e LTO_CLANG_THIN -d LTO_CLANG_FULL
          ./scripts/config --file .config -e CFI_CLANG -e CFI_CLANG_SHADOW
          ./scripts/config --file .config -d DEBUG_INFO -d DEBUG_INFO_BTF -d DEBUG_INFO_DWARF5 -d DEBUG_INFO_DWARF4
          make LLVM=1 ARCH=arm64 olddefconfig
          grep -E '^CONFIG_(KSU|LTO|CFI|LOCALVERSION|MODVERSIONS|DEBUG_INFO)=' .config || true

      - name: Build
        run: |
          cd kernel
          make LLVM=1 ARCH=arm64 -j4 Image
          ls -l arch/arm64/boot/Image
          cat include/config/kernel.release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            kernel/arch/arm64/boot/Image
            kernel/vmlinux.symvers
            kernel/.config
